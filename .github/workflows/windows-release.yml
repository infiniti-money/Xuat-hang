name: Windows build, regression tests and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hisa-release-main
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and validate Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check application versions
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/Hisa.App/Hisa.App.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          $info = Get-Content -LiteralPath 'src/Hisa.App/SoftwareInfo.cs' -Raw
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid application version: $version" }
          if (-not $info.Contains('public const string Version = "' + $version + '";')) {
            throw 'Hisa.App.csproj and SoftwareInfo.cs have different versions'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore and build self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish 'src/Hisa.App/Hisa.App.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish --nologo
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (!(Test-Path -LiteralPath 'publish/HISA Kho Vat Tu.exe')) { throw 'Windows executable missing' }

      - name: Run isolated regression tests
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path 'publish').Path 'HISA Kho Vat Tu.exe'
          $report = Join-Path $env:RUNNER_TEMP ("hisa-self-test-" + [guid]::NewGuid().ToString('N') + '.json')
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--output', ('"' + $report + '"')) -PassThru -Wait
          if (!(Test-Path -LiteralPath $report)) { throw 'Self-test did not create a new report' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or $result.success -ne $true -or $result.checks.Count -lt 1) {
            Get-Content -LiteralPath $report
            throw "Regression tests failed (exit $($process.ExitCode))"
          }
          Write-Host "Regression tests passed: $($result.checks.Count)"
          Copy-Item -LiteralPath $report -Destination 'self-test.json'

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is missing' }

      - name: Obtain Vietnamese installer language
        shell: pwsh
        run: |
          # Vietnamese is a community-maintained translation, not bundled with Inno Setup.
          # Pin its upstream revision for reproducible Windows builds.
          $url = 'https://raw.githubusercontent.com/jrsoftware/issrc/2527da77ff7983514f535d19391a748c5d898336/Files/Languages/Unofficial/Vietnamese.isl'
          Invoke-WebRequest -Uri $url -OutFile 'installer/Vietnamese.isl'
          if (!(Test-Path 'installer/Vietnamese.isl') -or (Get-Item 'installer/Vietnamese.isl').Length -lt 10000) {
            throw 'Cannot retrieve the official upstream Vietnamese translation'
          }

      - name: Build Vietnamese Windows installer
        id: installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          & $compiler "/DAppVersion=$env:APP_VERSION" "installer\\Hisa.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed' }
          $setup = (Resolve-Path "installer-output/HISA-Kho-Vat-Tu-$env:APP_VERSION-Setup.exe").Path
          "setup=$setup" >> $env:GITHUB_OUTPUT
          $checksum = "$setup.sha256"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content -LiteralPath $checksum -Encoding ascii
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Create ZIP and SHA-256 checksum
        id: package
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "HISA-Kho-Vat-Tu-$env:APP_VERSION"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path 'publish/*' -Destination $stage -Recurse -Force
          Copy-Item 'README.md', 'RELEASE_NOTES.md' -Destination $stage
          $zip = Join-Path (Get-Location).Path "HISA-Kho-Vat-Tu-$env:APP_VERSION-win-x64.zip"
          Compress-Archive -LiteralPath $stage -DestinationPath $zip -CompressionLevel Optimal -Force
          $checksum = "$zip.sha256"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -LiteralPath $checksum -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HISA-Windows-x64-${{ steps.version.outputs.version }}
          path: |
            HISA-Kho-Vat-Tu-*.zip
            HISA-Kho-Vat-Tu-*.zip.sha256
            installer-output/HISA-Kho-Vat-Tu-*.exe
            installer-output/HISA-Kho-Vat-Tu-*.exe.sha256
            self-test.json
          if-no-files-found: error

      - name: Publish first release if version is new
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ZIP: ${{ steps.package.outputs.zip }}
          RELEASE_HASH: ${{ steps.package.outputs.checksum }}
          RELEASE_SETUP: ${{ steps.installer.outputs.setup }}
          RELEASE_SETUP_HASH: ${{ steps.installer.outputs.checksum }}
        run: |
          $tag = "v$env:APP_VERSION"
          # If GitHub briefly fails at the final publishing call it can leave a
          # fully uploaded release as a draft. Resume it instead of silently
          # accepting a draft as an already-published release.
          function Find-Release([string]$tagName) {
            $raw = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw "Could not list GitHub releases" }
            return @($raw | ConvertFrom-Json | Where-Object { $_.tag_name -eq $tagName } | Select-Object -First 1)
          }
          function Publish-ExistingDraft($release) {
            $needed = @(
              "HISA-Kho-Vat-Tu-$env:APP_VERSION-Setup.exe",
              "HISA-Kho-Vat-Tu-$env:APP_VERSION-Setup.exe.sha256",
              "HISA-Kho-Vat-Tu-$env:APP_VERSION-win-x64.zip",
              "HISA-Kho-Vat-Tu-$env:APP_VERSION-win-x64.zip.sha256"
            )
            $assets = @($release.assets | ForEach-Object { $_.name })
            $missing = @($needed | Where-Object { $_ -notin $assets })
            if ($missing.Count -ne 0) {
              throw "Draft $tag is missing assets: $($missing -join ', '). Refusing to publish incomplete release."
            }
            foreach ($attempt in 1..6) {
              gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -F draft=false -F make_latest=true
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Published existing draft release $tag after transient GitHub error."
                return
              }
              Write-Warning "GitHub draft publish failed, retry $attempt/6."
              Start-Sleep -Seconds ([Math]::Min(5*$attempt,20))
            }
            throw "Could not publish existing draft $tag"
          }
          $found = @(Find-Release $tag)
          if ($found.Count -gt 0) {
            if (-not [bool]$found[0].draft) {
              Write-Host "Release $tag is already public. Preserving existing assets."
              exit 0
            }
            Publish-ExistingDraft $found[0]
            exit 0
          }
          gh release create $tag $env:RELEASE_ZIP $env:RELEASE_HASH $env:RELEASE_SETUP $env:RELEASE_SETUP_HASH --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HISA Quản lý kho $tag (Windows x64)" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) {
            # gh may have uploaded all assets before the API returned 500.
            $found = @(Find-Release $tag)
            if ($found.Count -gt 0 -and [bool]$found[0].draft) {
              Publish-ExistingDraft $found[0]
            }
            else { throw "Could not publish GitHub release $tag" }
          }
